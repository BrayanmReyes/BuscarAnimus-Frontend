<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Anime Schedule</title>
    <link rel="icon" type="image/gif" href="https://i.pinimg.com/originals/ba/f9/ab/baf9ab65f11b280b184fbab633024be3.gif">
    <!-- Archivos CSS separados -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="stylesheet" href="css/anichart-nav.css">
    <style>
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .schedule-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .schedule-img-container {
            width: 100%;
            height: 280px;
            position: relative;
        }
        .schedule-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .schedule-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .schedule-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-episode {
            font-size: 0.9rem;
            color: #ff6b6b;
            font-weight: 500;
            margin-bottom: 15px;
        }
        .search-torrent-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            text-align: center;
            width: 100%;
            font-size: 0.9rem;
        }
        .search-torrent-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="theme-toggle-wrapper">
                <span class="theme-icon light-icon">☀️</span>
                <label class="theme-toggle">
                    <input type="checkbox" id="theme-toggle-input">
                    <span class="theme-toggle-slider"></span>
                </label>
                <span class="theme-icon dark-icon">🌙</span>
            </div>
            <div class="header-content">
                <h1>Daily Schedule</h1>
                <p class="subtitle">Anime episodes airing today</p>
            </div>
            <div class="header-actions">
                <button id="hamburger-btn" class="hamburger-btn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="nav-buttons">
                    <a href="index.html" class="nav-button">Search</a>
                    <a href="schedule.html" class="nav-button active">Schedule</a>
                    <a href="anichart.html" class="nav-button">Airing</a>
                    <a href="watchlist.html" class="nav-button">Watchlist</a>
                    <a href="trending.html" class="nav-button">Trending</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="main-content-wrapper">
        <div class="container">
            <div id="error-message" class="error-message"></div>
            <div id="loading" class="loading">
                <div class="bouncing-dots-loader">
                    <div></div> <div></div> <div></div>
                </div>
                <p>Loading today's schedule...</p>
            </div>
            <div id="schedule-container" class="schedule-grid">
                <!-- Schedule cards will be injected here -->
            </div>
        </div>
    </div>

    <div id="pageTransitionLoader" class="page-transition-loader">
        <div class="bouncing-dots-loader">
            <div></div> <div></div> <div></div>
        </div>
    </div>

    <button id="scrollToTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px">
            <path d="M0 0h24v24H0V0z" fill="none"/>
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z"/>
        </svg>
    </button>

    <footer>
        <div class="container">
            <p>&copy; 2024 Anime Search. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Archivos JS separados -->
    <script src="js/theme.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
